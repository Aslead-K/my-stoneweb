<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブログ｜株式会社ASLEAD</title>
  <meta name="description" content="">
  <link rel="stylesheet" href="/style.css">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .post-hero {
      background: var(--white);
      padding: 60px 24px 48px;
      text-align: center;
      border-bottom: 1px solid var(--stone);
    }
    .post-date {
      font-size: .75rem;
      color: var(--ink-light);
      letter-spacing: .08em;
      display: block;
      margin-bottom: 16px;
    }
    .post-title {
      font-family: var(--serif);
      font-size: clamp(1.4rem, 3.5vw, 2.2rem);
      font-weight: 600;
      letter-spacing: .04em;
      line-height: 1.4;
    }
    .post-thumb {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      display: block;
    }
    .post-main {
      max-width: 720px;
      margin: 0 auto;
      padding: 56px 24px 96px;
    }
    .post-body {
      font-size: .92rem;
      line-height: 1.9;
      color: var(--ink);
    }
    .post-body h2 {
      font-family: var(--serif);
      font-size: 1.3rem;
      font-weight: 600;
      margin: 40px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--stone);
    }
    .post-body h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 28px 0 12px;
    }
    .post-body p { margin-bottom: 16px; }
    .post-body img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
      margin: 24px 0;
    }
    .post-body ul, .post-body ol {
      padding-left: 24px;
      margin-bottom: 16px;
    }
    .post-body li { margin-bottom: 6px; }
    .post-body blockquote {
      border-left: 3px solid var(--stone-dark);
      padding: 8px 16px;
      color: var(--ink-mid);
      margin: 24px 0;
    }
    .post-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: .82rem;
      color: var(--ink-mid);
      text-decoration: none;
      margin-bottom: 40px;
      transition: color .2s;
    }
    .post-back:hover { color: var(--ink); }
    .post-loading {
      text-align: center;
      color: var(--ink-light);
      padding: 80px 0;
      font-size: .88rem;
    }
  </style>
</head>
<body>

<!-- ===== ヘッダー ===== -->
<header class="site-header">
  <div class="container">
    <a href="/" class="logo">
      <span class="logo-en">ASLEAD</span>
      <span class="logo-ja">株式会社ASLEAD</span>
    </a>
    <div class="header-tel">
      03-6380-0904
      <span>平日 9:00〜18:00</span>
    </div>
    <nav class="header-nav" id="nav">
      <a href="/">TOP</a>
      <a href="/#service">サービス</a>
      <a href="/about/">会社概要</a>
      <a href="/blog/">ブログ</a>
      <a href="/contact/" class="btn-contact">お問い合わせ</a>
    </nav>
    <button class="menu-toggle" id="menuBtn" aria-label="メニュー">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- ===== パンくず ===== -->
<div style="background:#fff; border-bottom:1px solid var(--stone); padding:10px 0;">
  <div class="container" style="font-size:.75rem; color:var(--ink-light); display:flex; gap:6px; align-items:center;">
    <a href="/" style="color:var(--ink-light); text-decoration:none;">TOP</a>
    <span>›</span>
    <a href="/blog/" style="color:var(--ink-light); text-decoration:none;">ブログ</a>
    <span>›</span>
    <span id="breadcrumbTitle">記事</span>
  </div>
</div>

<!-- ===== 記事ヘッダー ===== -->
<section class="post-hero" id="postHero">
  <div class="post-loading">記事を読み込み中...</div>
</section>

<!-- ===== サムネイル ===== -->
<div id="thumbWrap"></div>

<!-- ===== 記事本文 ===== -->
<main class="post-main">
  <a href="/blog/" class="post-back">← ブログ一覧に戻る</a>
  <div class="post-body" id="postBody"></div>
</main>

<!-- ===== フッター ===== -->
<footer class="site-footer">
  <div class="container">
    <div class="footer-inner">
      <div>
        <div class="footer-logo">ASLEAD</div>
        <p>株式会社ASLEAD</p>
        <p style="margin-top:6px;">〒160-0022<br>東京都新宿区新宿1丁目36番2号</p>
        <p style="margin-top:6px;">TEL：03-6380-0904</p>
      </div>
      <nav class="footer-links">
        <a href="/">TOP</a>
        <a href="/#service">サービス</a>
        <a href="/about/">会社概要</a>
        <a href="/blog/">ブログ</a>
        <a href="/contact/">お問い合わせ</a>
      </nav>
    </div>
    <div class="footer-copy">
      &copy; 2024 ASLEAD Inc. All Rights Reserved.
    </div>
  </div>
</footer>

<script>
  const btn = document.getElementById('menuBtn');
  const navEl = document.getElementById('nav');
  btn.addEventListener('click', () => navEl.classList.toggle('open'));

  const OWNER = 'Aslead-K';
  const REPO  = 'my-stoneweb';

  async function loadPost() {
    const params = new URLSearchParams(location.search);
    const slug   = params.get('slug');
    if (!slug) { location.href = '/blog/'; return; }

    const url = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/blog/posts/${slug}.md`;
    const res = await fetch(url);
    if (!res.ok) { location.href = '/blog/'; return; }

    const text = await res.text();
    const { meta, body } = parseFrontmatter(text);

    // タイトル
    document.title = `${meta.title} | ASLEAD`;
    document.getElementById('breadcrumbTitle').textContent = meta.title;

    // ヒーロー
    document.getElementById('postHero').innerHTML = `
      <span class="post-date">${formatDate(meta.date)}</span>
      <h1 class="post-title">${meta.title}</h1>
    `;

    // サムネイル
    if (meta.thumbnail) {
      document.getElementById('thumbWrap').innerHTML =
        `<img class="post-thumb" src="${meta.thumbnail}" alt="${meta.title}">`;
    }

    // 本文
    document.getElementById('postBody').innerHTML = marked.parse(body);
  }

  function parseFrontmatter(text) {
    const match = text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
    if (!match) return { meta: {}, body: text };

    const fm = match[1];
    const body = match[2];
    const get = key => {
      const m = fm.match(new RegExp(`^${key}:\\s*["']?(.+?)["']?\\s*$`, 'm'));
      return m ? m[1] : '';
    };

    return {
      meta: {
        title:       get('title'),
        date:        get('date'),
        thumbnail:   get('thumbnail'),
        description: get('description'),
      },
      body
    };
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  }

  loadPost();
</script>

</body>
</html>
