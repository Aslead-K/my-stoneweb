<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブログ｜株式会社ASLEAD</title>
  <meta name="description" content="石材クリーニングに関するお役立ち情報・施工事例をお届けします。">
  <link rel="stylesheet" href="../style.css">
  <style>
    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 28px;
    }

    .blog-card {
      background: var(--white);
      border: 1px solid var(--stone);
      transition: box-shadow .2s, transform .2s;
    }

    .blog-card:hover {
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
      transform: translateY(-3px);
    }

    .blog-thumb {
      aspect-ratio: 16/9;
      background: var(--stone);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--stone-dark);
      font-size: .7rem;
      letter-spacing: .1em;
    }

    .blog-body {
      padding: 20px 22px 24px;
    }

    .blog-meta {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: .7rem;
      color: var(--ink-light);
      margin-bottom: 10px;
    }

    .blog-cat {
      background: var(--bg);
      border: 1px solid var(--stone-dark);
      padding: 2px 10px;
      border-radius: 2px;
      letter-spacing: .05em;
    }

    .blog-title {
      font-size: .92rem;
      font-weight: 700;
      line-height: 1.6;
      margin-bottom: 10px;
      color: var(--ink);
    }

    .blog-excerpt {
      font-size: .78rem;
      color: var(--ink-light);
      line-height: 1.8;
    }

    .blog-empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 80px 0;
      color: var(--ink-light);
      font-size: .88rem;
    }

    .blog-empty strong {
      display: block;
      font-family: var(--serif);
      font-size: 1.2rem;
      color: var(--ink);
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/" class="logo">
      <span class="logo-en">ASLEAD</span>
      <span class="logo-ja">株式会社ASLEAD</span>
    </a>
    <div class="header-tel">
      03-6380-0904
      <span>平日 9:00〜18:00</span>
    </div>
    <nav class="header-nav" id="nav">
      <a href="/">TOP</a>
      <a href="/#service">サービス</a>
      <a href="/about/">会社概要</a>
      <a href="/blog/">ブログ</a>
      <a href="/contact/" class="btn-contact">お問い合わせ</a>
    </nav>
    <button class="menu-toggle" id="menuBtn" aria-label="メニュー">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div class="breadcrumb">
  <div class="container">
    <a href="/">TOP</a><span>›</span>ブログ
  </div>
</div>

<div class="page-banner">
  <div class="container">
    <p class="page-sub">Blog</p>
    <h1>ブログ</h1>
  </div>
</div>

<section class="section">
  <div class="container">
    <p class="section-sub">Latest Posts</p>
    <h2 class="section-title">お役立ち情報・施工事例</h2>
    <div class="divider"></div>

    <div class="blog-grid">
      <!-- ▼ 記事を追加するときはここをコピーして増やしてください ▼ -->
      <!--
      <article class="blog-card">
        <div class="blog-thumb">サムネイル画像</div>
        <div class="blog-body">
          <div class="blog-meta">
            <span class="blog-cat">施工事例</span>
            <time>2024-06-01</time>
          </div>
          <h2 class="blog-title"><a href="/blog/article-slug/">記事タイトルをここに入力</a></h2>
          <p class="blog-excerpt">記事の概要をここに入力します。100文字程度が目安です。</p>
        </div>
      </article>
      -->
      <!-- ▲ ここまでがテンプレート ▲ -->

      <div class="blog-empty">
        <strong>記事を準備中です</strong>
        近日公開予定です。しばらくお待ちください。
      </div>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-inner">
      <div>
        <div class="footer-logo">ASLEAD</div>
        <p>株式会社ASLEAD</p>
        <p style="margin-top:6px;">〒160-0022<br>東京都新宿区新宿1丁目36番2号</p>
        <p style="margin-top:6px;">TEL：03-6380-0904</p>
      </div>
      <nav class="footer-links">
        <a href="/">TOP</a>
        <a href="/#service">サービス</a>
        <a href="/about/">会社概要</a>
        <a href="/blog/">ブログ</a>
        <a href="/contact/">お問い合わせ</a>
      </nav>
    </div>
    <div class="footer-copy">&copy; 2024 ASLEAD Inc. All Rights Reserved.</div>
  </div>
</footer>

<script>
  document.getElementById('menuBtn').addEventListener('click', () => {
    document.getElementById('nav').classList.toggle('open');
  });
</script>
</body>
</html>
