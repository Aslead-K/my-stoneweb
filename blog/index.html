<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ブログ｜株式会社ASLEAD</title>
  <meta name="description" content="石材クリーニングに関するお役立ち情報・施工事例をお届けします。">
  <link rel="stylesheet" href="/style.css">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .blog-hero {
      background: var(--white);
      padding: 60px 24px 48px;
      text-align: center;
      border-bottom: 1px solid var(--stone);
    }
    .blog-hero-label {
      font-size: .7rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--stone-dark);
      display: block;
      margin-bottom: 12px;
    }
    .blog-hero h1 {
      font-family: var(--serif);
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 600;
      letter-spacing: .06em;
    }

    .blog-main {
      max-width: 900px;
      margin: 0 auto;
      padding: 64px 24px 96px;
    }

    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 32px;
    }

    .blog-card {
      background: var(--white);
      border: 1px solid var(--stone);
      border-radius: 4px;
      overflow: hidden;
      text-decoration: none;
      color: var(--ink);
      display: flex;
      flex-direction: column;
      transition: box-shadow .2s;
    }
    .blog-card:hover {
      box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }

    .blog-card-thumb {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: var(--stone);
      display: block;
    }

    .blog-card-thumb-placeholder {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--stone);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--stone-dark);
      font-size: .7rem;
      letter-spacing: .1em;
    }

    .blog-card-body {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .blog-card-date {
      font-size: .72rem;
      color: var(--ink-light);
      margin-bottom: 8px;
      letter-spacing: .05em;
    }

    .blog-card-title {
      font-size: .95rem;
      font-weight: 700;
      line-height: 1.5;
      margin-bottom: 10px;
      letter-spacing: .03em;
    }

    .blog-card-desc {
      font-size: .8rem;
      color: var(--ink-mid);
      line-height: 1.7;
      flex: 1;
    }

    .blog-empty {
      text-align: center;
      color: var(--ink-light);
      font-size: .88rem;
      padding: 80px 0;
    }

    .blog-loading {
      text-align: center;
      color: var(--ink-light);
      font-size: .88rem;
      padding: 80px 0;
    }
  </style>
</head>
<body>

<!-- ===== ヘッダー ===== -->
<header class="site-header">
  <div class="container">
    <a href="/" class="logo">
      <span class="logo-en">ASLEAD</span>
      <span class="logo-ja">株式会社ASLEAD</span>
    </a>
    <div class="header-tel">
      03-6380-0904
      <span>平日 9:00〜18:00</span>
    </div>
    <nav class="header-nav" id="nav">
      <a href="/">TOP</a>
      <a href="/#service">サービス</a>
      <a href="/about/">会社概要</a>
      <a href="/blog/">ブログ</a>
      <a href="/contact/" class="btn-contact">お問い合わせ</a>
    </nav>
    <button class="menu-toggle" id="menuBtn" aria-label="メニュー">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- ===== パンくず ===== -->
<div class="breadcrumb" style="background:#fff; border-bottom:1px solid var(--stone); padding:10px 0;">
  <div class="container" style="font-size:.75rem; color:var(--ink-light); display:flex; gap:6px; align-items:center;">
    <a href="/" style="color:var(--ink-light); text-decoration:none;">TOP</a>
    <span>›</span>
    <span>ブログ</span>
  </div>
</div>

<!-- ===== ページヒーロー ===== -->
<section class="blog-hero">
  <span class="blog-hero-label">Blog</span>
  <h1>ブログ</h1>
</section>

<!-- ===== 記事一覧 ===== -->
<main class="blog-main">
  <div id="blogGrid" class="blog-grid">
    <div class="blog-loading">記事を読み込み中...</div>
  </div>
</main>

<!-- ===== フッター ===== -->
<footer class="site-footer">
  <div class="container">
    <div class="footer-inner">
      <div>
        <div class="footer-logo">ASLEAD</div>
        <p>株式会社ASLEAD</p>
        <p style="margin-top:6px;">〒160-0022<br>東京都新宿区新宿1丁目36番2号</p>
        <p style="margin-top:6px;">TEL：03-6380-0904</p>
      </div>
      <nav class="footer-links">
        <a href="/">TOP</a>
        <a href="/#service">サービス</a>
        <a href="/about/">会社概要</a>
        <a href="/blog/">ブログ</a>
        <a href="/contact/">お問い合わせ</a>
      </nav>
    </div>
    <div class="footer-copy">
      &copy; 2024 ASLEAD Inc. All Rights Reserved.
    </div>
  </div>
</footer>

<script>
  // ハンバーガーメニュー
  const btn = document.getElementById('menuBtn');
  const nav = document.getElementById('nav');
  btn.addEventListener('click', () => nav.classList.toggle('open'));

  // GitHub APIで記事一覧を取得
  const OWNER = 'Aslead-K';
  const REPO  = 'my-stoneweb';
  const DIR   = 'blog/posts';

  async function loadPosts() {
    const grid = document.getElementById('blogGrid');
    try {
      const res  = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${DIR}`);
      const files = await res.json();

      if (!Array.isArray(files) || files.length === 0) {
        grid.innerHTML = '<div class="blog-empty">記事はまだありません。</div>';
        return;
      }

      // 各ファイルの中身を取得
      const posts = await Promise.all(
        files
          .filter(f => f.name.endsWith('.md'))
          .map(async f => {
            const r    = await fetch(f.download_url);
            const text = await r.text();
            return parseFrontmatter(text, f.name);
          })
      );

      // 日付の新しい順に並べる
      posts.sort((a, b) => new Date(b.date) - new Date(a.date));

      grid.innerHTML = posts.map(p => `
        <a class="blog-card" href="/blog/post.html?slug=${p.slug}">
          ${p.thumbnail
            ? `<img class="blog-card-thumb" src="${p.thumbnail}" alt="${p.title}">`
            : `<div class="blog-card-thumb-placeholder">ASLEAD</div>`
          }
          <div class="blog-card-body">
            <div class="blog-card-date">${formatDate(p.date)}</div>
            <div class="blog-card-title">${p.title}</div>
            ${p.description ? `<div class="blog-card-desc">${p.description}</div>` : ''}
          </div>
        </a>
      `).join('');

    } catch(e) {
      grid.innerHTML = '<div class="blog-empty">記事の読み込みに失敗しました。</div>';
    }
  }

  function parseFrontmatter(text, filename) {
    const slug = filename.replace('.md', '');
    const match = text.match(/^---\n([\s\S]*?)\n---/);
    if (!match) return { slug, title: slug, date: '', description: '', thumbnail: '' };

    const fm = match[1];
    const get = key => {
      const m = fm.match(new RegExp(`^${key}:\\s*["']?(.+?)["']?\\s*$`, 'm'));
      return m ? m[1] : '';
    };

    return {
      slug,
      title:       get('title')       || slug,
      date:        get('date')        || '',
      description: get('description') || '',
      thumbnail:   get('thumbnail')   || '',
    };
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  }

  loadPosts();
</script>

</body>
</html>
