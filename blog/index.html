<script>
  // ハンバーガーメニュー
  const btn = document.getElementById('menuBtn');
  const nav = document.getElementById('nav');
  btn.addEventListener('click', () => nav.classList.toggle('open'));

  const OWNER = 'Aslead-K';
  const REPO  = 'my-stoneweb';

  // ここに記事ファイル名を追加していく
  const POST_FILES = [
    '2026-06-03-ブログのテスト記事.md',
    '2026-06-03-ブログのテスト記事２.md',
  ];

  async function loadPosts() {
    const grid = document.getElementById('blogGrid');
    try {
      if (POST_FILES.length === 0) {
        grid.innerHTML = '<div class="blog-empty">記事はまだありません。</div>';
        return;
      }

      const posts = await Promise.all(
        POST_FILES.map(async filename => {
          const url = `https://raw.githubusercontent.com/${OWNER}/${REPO}/main/blog/posts/${encodeURIComponent(filename)}`;
          const r    = await fetch(url);
          const text = await r.text();
          return parseFrontmatter(text, filename.replace('.md', ''));
        })
      );

      posts.sort((a, b) => new Date(b.date) - new Date(a.date));

      grid.innerHTML = posts.map(p => `
        <a class="blog-card" href="/blog/post.html?slug=${encodeURIComponent(p.slug)}">
          ${p.thumbnail
            ? `<img class="blog-card-thumb" src="${p.thumbnail}" alt="${p.title}">`
            : `<div class="blog-card-thumb-placeholder">ASLEAD</div>`
          }
          <div class="blog-card-body">
            <div class="blog-card-date">${formatDate(p.date)}</div>
            <div class="blog-card-title">${p.title}</div>
            ${p.description ? `<div class="blog-card-desc">${p.description}</div>` : ''}
          </div>
        </a>
      `).join('');

    } catch(e) {
      grid.innerHTML = '<div class="blog-empty">記事の読み込みに失敗しました。</div>';
    }
  }

  function parseFrontmatter(text, slug) {
    const match = text.match(/^---\n([\s\S]*?)\n---/);
    if (!match) return { slug, title: slug, date: '', description: '', thumbnail: '' };
    const fm  = match[1];
    const get = key => {
      const m = fm.match(new RegExp(`^${key}:\\s*["']?(.+?)["']?\\s*$`, 'm'));
      return m ? m[1] : '';
    };
    return {
      slug,
      title:       get('title')       || slug,
      date:        get('date')        || '',
      description: get('description') || '',
      thumbnail:   get('thumbnail')   || '',
    };
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  }

  loadPosts();
</script>
